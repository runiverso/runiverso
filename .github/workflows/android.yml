# Compila la app Android de Runiverso (Trusted Web Activity sobre runiverso.com/app).
# Sale SIN FIRMAR: se firma fuera de GitHub con la clave de subida, que no está en el repositorio.
name: App Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0
      - name: Configurar Bubblewrap con el JDK y el SDK del runner
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
      - name: Generar el proyecto Android desde twa-manifest.json
        working-directory: android
        run: yes | bubblewrap update --skipVersionUpgrade
      - name: Compilar (sin firmar)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Alinear el APK y preparar la herramienta de firma oficial
        working-directory: android
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          mkdir -p /tmp/out
          cp app/build/outputs/bundle/release/*.aab /tmp/out/runiverso-sin-firmar.aab
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/out/runiverso-sin-firmar-alineado.apk
          cp "$BT/lib/apksigner.jar" /tmp/out/apksigner.jar
          echo "$BT" > /tmp/out/build-tools.txt
          ls -la /tmp/out
      - name: Publicar en la rama android-builds (sin firmar, no contiene claves)
        run: |
          cd /tmp/out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b android-builds
          git add .
          git commit -qm "Compilación ${{ github.run_number }} (${{ github.sha }})"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-builds
      - uses: actions/upload-artifact@v4
        with:
          name: runiverso-android-sin-firmar
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
